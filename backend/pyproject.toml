[project]
name = "routing-guides"
version = "0.1.0"
description = "Local retailer routing guide review and validation workspace"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "alembic>=1.14,<2",
  "procrastinate>=3.5,<4",
  "python-multipart>=0.0.20,<1",
  "anthropic>=0.60,<1",
  "openai>=2,<3",
  "httpx>=0.28,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/routing_guides"]
