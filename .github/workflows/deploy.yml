name: Publish and deploy ECS
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after publishing (disable for the first infrastructure bootstrap)
        type: boolean
        default: true
      configure_task:
        description: Apply the dev task template (first deployment or deliberate task configuration update)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ecs-poc-deployment
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: poc
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      AWS_MIGRATION_ROLE_ARN: ${{ vars.AWS_MIGRATION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment configuration
        env:
          DEPLOY: ${{ inputs.deploy }}
        run: |
          for name in AWS_REGION AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE; do
            if [ -z "${!name}" ]; then
              echo "::error::Set $name in the GitHub poc environment before running this workflow."
              exit 1
            fi
          done
          if [ "$DEPLOY" = "true" ] && [ -z "$AWS_MIGRATION_ROLE_ARN" ]; then
            echo "::error::Set AWS_MIGRATION_ROLE_ARN in the GitHub poc environment before deploying."
            exit 1
          fi
      - name: Assume deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          unset-current-credentials: true
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish image reference
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
        run: |
          echo "Image to deploy (immutable digest): \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare task definitions
        if: inputs.deploy
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}@${{ steps.image.outputs.digest }}
          TASK_DEFINITION_FILE: ${{ inputs.configure_task && 'deploy/dev-task-definition.json' || '' }}
        run: python3 scripts/ecs_deploy.py prepare --state "$RUNNER_TEMP/parse-deployment.json"
      - name: Assume migration role
        if: inputs.deploy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_MIGRATION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          unset-current-credentials: true
      - name: Run database migrations
        if: inputs.deploy
        run: python3 scripts/ecs_deploy.py migrate --state "$RUNNER_TEMP/parse-deployment.json"
      - name: Restore deployment role
        if: inputs.deploy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          unset-current-credentials: true
      - name: Deploy ECS service
        if: inputs.deploy
        run: python3 scripts/ecs_deploy.py deploy --state "$RUNNER_TEMP/parse-deployment.json"
      - name: Remove deployment state
        if: always()
        run: rm -f "$RUNNER_TEMP/parse-deployment.json"
